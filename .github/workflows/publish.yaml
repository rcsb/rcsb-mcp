name: CI Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  release:
    types: [published]

jobs:

  hatch-test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ["self-hosted", "buildchain"]
    timeout-minutes: 20
    strategy:
      matrix:
        # 3.10 is the floor declared in pyproject; 3.11 is what the Docker image
        # actually runs. Test both, or a break that only shows below 3.12 reaches
        # production as a CrashLoopBackOff (the container never binds its port, so
        # the only symptom is a readiness probe that never passes).
        python-version: ["3.10", "3.11"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Hatch
        run: pip install hatch

      - name: Run tests
        run: hatch test

  hatch-build:
    name: Build to PyPI
    needs:
      - hatch-test
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Hatch
        run: pip install hatch

      - name: Build distribution
        run: hatch build

      - name: Store the distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  push-image:
    needs:
      - hatch-build
    name: Push image to harbor
    uses: ./.github/workflows/_workflow-docker.yaml
    secrets: inherit

  restart-k8s-prod-deployment:
    name: "Restart production deployments"
    # A release retags the image as `production` in harbor, but the Deployment's tag STRING
    # never changes — so Kubernetes sees nothing to reconcile and the pods keep serving the
    # old image. `kubectl rollout restart` replaces them, and because values.yaml sets
    # pullPolicy: Always each new pod re-resolves :production and gets the release. This is
    # the step whose absence left production serving a stale image.
    #
    # It does NOT apply k8s/helm changes — a rollout restart reuses the existing Deployment
    # spec. Chart/values edits still need `helm upgrade`, which no shared action provides.
    uses: rcsb/devops-cicd-github-actions/.github/workflows/restart_k8s_deployment.yaml@master
    needs:
      # push-image is what moves the `production` tag, so the restart must follow it.
      - push-image
    # Redundant today (push-image already only runs on releases, via hatch-build) but
    # explicit, so enabling image builds on master pushes cannot silently start restarting
    # production. The shared workflow's `rollout status --watch` fails the job if the new
    # image never becomes ready, which makes this a deployment gate rather than fire-and-forget.
    if: github.event_name == 'release'
    strategy:
      matrix:
        # Both clusters serve mcp-beta — see the east/west ingress hosts in
        # k8s/helm/values/production.yaml.
        coast: ['west', 'east']
    with:
      namespace: production
      region: ${{ matrix.coast }}
      # Confirmed against both clusters (2026-10-05): production-rcsb-mcp, 2/2 ready in
      # rcsb-west and rcsb-east, image …/rcsb-mcp:production with pullPolicy Always. The
      # sibling production-rcsb-mcp-redis is deliberately NOT restarted — it holds the
      # report short-link store, and cycling it would drop live links for no benefit.
      deployment_name: production-rcsb-mcp

  publish-to-pypi:
    name: >-
      Publish Python 🐍 distribution 📦 to PyPI
    if: github.event_name == 'release'
    needs:
      - hatch-build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/rcsb-mcp
    permissions:
      id-token: write

    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-to-registry:
    name: Publish to MCP Registry
    if: github.event_name == 'release'
    needs:
      # The PyPI package must exist first — the registry validates that the
      # version in server.json is published and carries the mcp-name marker.
      - publish-to-pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # OIDC token for github-oidc auth to the registry
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify server.json version matches the package
        run: |
          server_version=$(jq -r .version server.json)
          pkg_version=$(grep -E '^version *=' pyproject.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "server.json=$server_version  pyproject.toml=$pkg_version"
          if [ "$server_version" != "$pkg_version" ]; then
            echo "::error::server.json version ($server_version) != pyproject.toml ($pkg_version). Bump both before releasing."
            exit 1
          fi

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
