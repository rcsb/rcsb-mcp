# This is a DEFAULT values file.
# All the dynamic values in helm templates must be stated in this file.
# Any environment specific values which needs to be overridden should be
# specified in environment specific values file in values directory.

replicaCount: 2
revisionHistoryLimit: 3

# Define container liveness and readiness checks.
# The MCP server exposes GET /healthz (returns 200 OK) for probes; the MCP itself
# is served at POST /mcp. The server starts in a couple of seconds (no model load).
livenessProbe:
  initialDelaySeconds: 10
  periodSeconds: 20
  failureThreshold: 3
  http:
    path: /healthz
readinessProbe:
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3
  http:
    path: /healthz


image:
  repository: "harbor.devops.k8s.rcsb.org/rcsb/rcsb-mcp"
  pullPolicy: Always
  tag: latest

imagePullSecrets: "harbor-docker-registry-conf"

deploymentStrategy:
  #https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#strategy
  #Type is either RollingUpdate or Recreate
  type: "RollingUpdate"
  #For rolling update, what percentage of total pods can be created above desired amount
  maxSurge: 25%
  #For rolling update, what percentage of total pods can be brought down to update
  maxUnavailable: 25%

podSecurityContext:
  fsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  port: 80
  containerPort: 8080

# Disabled by default; enabled with real hosts/TLS in the environment values
# (see values/production.yaml). Clients reach the MCP at https://<host>/mcp.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

# The MCP is a lightweight, I/O-bound HTTP proxy to the public RCSB APIs — no GPU/ML.
resources:
  limits:
    cpu: "1"
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# useSecretsVolume if your application will mount a secret from the Vault service as a file on the filesystem.
# Not needed for this server: the RCSB/EBI APIs it calls are public and require no key.
useSecretsVolume: false
secretVolumes:
  name: app-secret
  mountPath: /app/secret
  filename: secret.txt
  secretName: app-generic-secret

# Root filesystem is read-only; point HOME at the writable /tmp tmpfs to be safe.
podEnvVars:
  - name: HOME
    value: /tmp
  # Set to the public origin that serves this MCP to make rcsb_render_report return
  # a report LINK instead of inline HTML, so the agent never reproduces the ~20 KB
  # document. It must be an origin whose ingress routes to this service (any of the
  # ingress hosts below). Confirm the real URL with DevOps before enabling — the
  # hosts here are placeholders. Left unset, the tool falls back to returning html.
  # - name: RCSB_MCP_REPORT_BASE_URL
  #   value: "https://rcsb-mcp.rcsb.org"
  #
  # The tool hands back a SHORT link (…/r/<id>) that redirects to the self-contained
  # …/r?d=<token> URL. The id → token map lives in a short-TTL store. With multiple
  # replicas and no session affinity, that store MUST be shared or a link minted on
  # one pod won't resolve on another (it degrades to the fat …/r?d= link, which always
  # works, but the token saving is lost). Enable the bundled Redis below (redis.enabled)
  # and the chart wires RCSB_MCP_REDIS_URL into the MCP pods automatically — don't set
  # it here as well. Unset ⇒ per-pod in-memory store.
  # - name: RCSB_MCP_REPORT_TTL_SECONDS   # short-link lifetime; default 3600
  #   value: "3600"

# Bundled Redis: shared short-TTL store so report short links minted on one MCP replica
# resolve on every replica. Deploys a single ephemeral Redis pod plus a ClusterIP
# Service; nothing routes to it from outside the cluster (no ingress rule, no external
# IP), so it is cluster-internal by construction. Data is disposable (persistence off):
# a Redis restart only degrades pending short links to the long …/r?d= form.
redis:
  enabled: false
  image:
    repository: redis
    tag: 7-alpine
    pullPolicy: IfNotPresent
  port: 6379
  # Keep memory bounded; evict least-recently-used keys (old short links) when full.
  maxmemory: 64mb
  maxmemoryPolicy: allkeys-lru
  resources:
    limits:
      cpu: 250m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 32Mi

arguments: null
