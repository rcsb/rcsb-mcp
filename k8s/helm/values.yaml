# This is a DEFAULT values file.
# All the dynamic values in helm templates must be stated in this file.
# Any environment specific values which needs to be overridden should be
# specified in environment specific values file in values directory.

replicaCount: 2
revisionHistoryLimit: 3

# Define container liveness and readiness checks.
# The MCP server exposes GET /healthz (returns 200 OK) for probes; the MCP itself
# is served at POST /mcp. The server starts in a couple of seconds (no model load).
livenessProbe:
  initialDelaySeconds: 10
  periodSeconds: 20
  failureThreshold: 3
  http:
    path: /healthz
readinessProbe:
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3
  http:
    path: /healthz


image:
  repository: "harbor.devops.k8s.rcsb.org/rcsb/rcsb-mcp"
  pullPolicy: Always
  tag: latest

imagePullSecrets: "harbor-docker-registry-conf"

deploymentStrategy:
  #https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#strategy
  #Type is either RollingUpdate or Recreate
  type: "RollingUpdate"
  #For rolling update, what percentage of total pods can be created above desired amount
  maxSurge: 25%
  #For rolling update, what percentage of total pods can be brought down to update
  maxUnavailable: 25%

podSecurityContext:
  fsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  port: 80
  containerPort: 8080

# Disabled by default; enabled with real hosts/TLS in the environment values
# (see values/production.yaml). Clients reach the MCP at https://<host>/mcp.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

# The MCP is a lightweight, I/O-bound HTTP proxy to the public RCSB APIs — no GPU/ML.
resources:
  limits:
    cpu: "1"
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# useSecretsVolume if your application will mount a secret from the Vault service as a file on the filesystem.
# Not needed for this server: the RCSB/EBI APIs it calls are public and require no key.
useSecretsVolume: false
secretVolumes:
  name: app-secret
  mountPath: /app/secret
  filename: secret.txt
  secretName: app-generic-secret

# Env for the MCP pods, as a MAP: per-environment files (values/*.yaml) deep-MERGE into
# this, so an override adds or changes one key without restating the rest. It used to be a
# list, which Helm replaces wholesale -- values/development.yaml overrode it with two
# entries and silently dropped RCSB_MCP_USER_AGENT.
#
# For env needing valueFrom (secretKeyRef/fieldRef), use `podEnvVars` instead -- still a
# list, still replaced, documented in templates/deployment.yaml.
podEnv:
  # Root filesystem is read-only; point HOME at the writable /tmp tmpfs to be safe.
  HOME: /tmp

  # User-Agent on every request this service makes to the RCSB (and EBI/UniProt) APIs, so
  # the hosted deployment's traffic can be told apart from local/stdio installs (which send
  # the default "rcsb-mcp/<version> (...)") in the upstream access logs. {version} is
  # substituted at RUNTIME by client.py from the package version -- a literal {version} in
  # the rendered manifest is correct, not a templating bug.
  RCSB_MCP_USER_AGENT: "rcsb-mcp-hosted/{version} (https://github.com/rcsb/rcsb-mcp)"

  # RCSB_MCP_REPORT_BASE_URL and RCSB_MCP_REPORT_LINK_BASE_URL are deliberately NOT set
  # here -- they are HOSTNAMES, so they belong to an environment, not to the chart. They
  # live in values/production.yaml and values/development.yaml.
  #
  # Unset is also the safe default: with no REPORT_BASE_URL the tool returns inline html
  # instead of a link, which is correct for stdio dev and for any deployment that has not
  # been given a real, remote-reachable origin. A default here would have emitted links to
  # someone else's host -- which is exactly what happened: the beta URL sat in this file and
  # the development deployment inherited it, so dev short links pointed at mcp-beta, whose
  # store has never seen those ids.
  #
  # RCSB_MCP_REPORT_TTL_SECONDS -- short-link lifetime; default 3600. Only governs the gap
  # between the agent emitting the link and the first click; after the redirect the URL is
  # self-contained and never expires.

# Env requiring valueFrom (secretKeyRef, fieldRef). A LIST, so an override REPLACES it.
podEnvVars: []

# Which cluster a pod is in, read from the `cluster-metadata` ConfigMap that both clusters
# already carry ({"COAST": "west"} / {"COAST": "east"}). The CLUSTER identifies itself, so
# one values file serves both regions and nothing has to be passed at `helm upgrade` time.
#
# Consumed by RCSB_MCP_REPORT_LINK_BASE_URL above, whose `{coast}` the app substitutes at
# startup -- the same shape as `{version}` in RCSB_MCP_USER_AGENT.
#
# optional: true below, so a namespace WITHOUT this ConfigMap still starts. The pod then has
# no COAST, the app declines to substitute, and the short link falls back to the public base
# -- degraded (links resolve about half the time behind a GSLB name) but never a broken URL.
# Without `optional` the pod would fail to start instead.
coastConfigMap: "cluster-metadata"
coastConfigMapKey: "COAST"
coastConfigMapOptional: true

redis:
  enabled: false
  image:
    repository: redis
    tag: 7-alpine
    pullPolicy: IfNotPresent
  port: 6379
  # Keep memory bounded; evict least-recently-used keys (old short links) when full.
  maxmemory: 64mb
  maxmemoryPolicy: allkeys-lru
  resources:
    limits:
      cpu: 250m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 32Mi

arguments: null
