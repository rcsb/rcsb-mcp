{{- if .Values.redis.enabled }}
# Ephemeral shared store for report short links. Single replica + Recreate: the data is
# a disposable short-TTL id→token cache, and a RollingUpdate would briefly run two
# Redises behind one Service, splitting the store. Losing the data is tolerable but not
# free: short links ALREADY handed out die with it (the token lives only here, so the
# GET /r/<id> route answers 410 Gone) — links are short-lived by design (TTL 1h), so a
# restart costs at most the last hour's links, not something worth a PVC. Links minted
# WHILE Redis is down fall back to the long self-contained …/r?d= form and keep working.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "helm_chart.redisFullname" . }}
  labels:
    {{- include "helm_chart.redisLabels" . | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "helm_chart.redisSelectorLabels" . | nindent 6 }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "helm_chart.redisSelectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: redis
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          # Persistence off (--save '' / no AOF): the store is a short-TTL cache, and with
          # no disk writes Redis runs as non-root on a read-only root filesystem.
          args:
            - redis-server
            - --port
            - {{ .Values.redis.port | quote }}
            - --save
            - ""
            - --appendonly
            - "no"
            - --maxmemory
            - {{ .Values.redis.maxmemory | quote }}
            - --maxmemory-policy
            - {{ .Values.redis.maxmemoryPolicy | quote }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - containerPort: {{ .Values.redis.port }}
              protocol: TCP
          livenessProbe:
            initialDelaySeconds: 5
            periodSeconds: 20
            exec:
              command: ["redis-cli", "-p", "{{ .Values.redis.port }}", "ping"]
          readinessProbe:
            initialDelaySeconds: 2
            periodSeconds: 10
            exec:
              command: ["redis-cli", "-p", "{{ .Values.redis.port }}", "ping"]
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          volumeMounts:
            - name: data   # writable workdir (/data) while the root filesystem is read-only
              mountPath: /data
      volumes:
        - name: data
          emptyDir:
            medium: Memory
{{- end }}
