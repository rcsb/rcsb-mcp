{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "helm_chart.redisFullname" . }}
  labels:
    {{- include "helm_chart.redisLabels" . | nindent 4 }}
spec:
  # ClusterIP with no ingress rule pointing at it: reachable only from inside the cluster.
  type: ClusterIP
  ports:
    - port: {{ .Values.redis.port }}
      targetPort: {{ .Values.redis.port }}
      protocol: TCP
  selector:
    {{- include "helm_chart.redisSelectorLabels" . | nindent 4 }}
{{- end }}
