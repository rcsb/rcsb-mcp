apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "helm_chart.fullname" . }}
  labels:
    {{- include "helm_chart.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit}}
  selector:
    matchLabels:
      {{- include "helm_chart.selectorLabels" . | nindent 6 }}
  strategy:
    type: {{ .Values.deploymentStrategy.type }}
    {{- if eq .Values.deploymentStrategy.type "RollingUpdate" }}
    rollingUpdate:
      maxSurge: {{ .Values.deploymentStrategy.maxSurge }}
      maxUnavailable: {{ .Values.deploymentStrategy.maxUnavailable }}
    {{- end }}
  template:
    metadata:
      labels:
        {{- include "helm_chart.selectorLabels" . | nindent 8 }}
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "helm_chart.selectorLabels" . | nindent 20 }}
                topologyKey: kubernetes.io/hostname
              weight: 1
      imagePullSecrets:
        - name: {{ .Values.imagePullSecrets }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.arguments }}
          args:
            {{- toYaml .Values.arguments | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - containerPort: {{ .Values.service.containerPort }}
              protocol: TCP
          livenessProbe:
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            httpGet:
              path: {{ .Values.livenessProbe.http.path }}
              port: {{ .Values.service.containerPort }}
          readinessProbe:
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            httpGet:
              path: {{ .Values.readinessProbe.http.path }}
              port: {{ .Values.service.containerPort }}
          {{- if or .Values.podEnv .Values.podEnvVars .Values.redis.enabled .Values.coastConfigMap }}
          env:
            {{- if .Values.redis.enabled }}
            # Auto-wired to the bundled Redis Service; don't also set this in podEnv.
            - name: RCSB_MCP_REDIS_URL
              value: "redis://{{ include "helm_chart.redisFullname" . }}:{{ .Values.redis.port }}/0"
            {{- end }}
            {{- /* podEnv is a MAP so per-environment files deep-MERGE into it. A list is
                   replaced wholesale, which silently drops entries the override forgot to
                   restate -- values/development.yaml did exactly that to
                   RCSB_MCP_USER_AGENT. `range` over a map iterates in sorted key order, so
                   the rendered manifest is stable. */}}
            {{- range $name, $value := .Values.podEnv }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- /* COAST: which cluster this pod is in, read from the ConfigMap both
                   clusters already carry. The app substitutes it into `{coast}` in
                   RCSB_MCP_REPORT_LINK_BASE_URL, so ONE values file serves both
                   regions and no --set is needed at upgrade time.

                   Marked optional so a namespace without the ConfigMap still starts:
                   the app then skips substitution and falls back to the public base,
                   rather than the pod failing to schedule. */}}
            {{- if .Values.coastConfigMap }}
            - name: COAST
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.coastConfigMap }}
                  key: {{ .Values.coastConfigMapKey }}
                  optional: {{ .Values.coastConfigMapOptional }}
            {{- end }}
            {{- /* Escape hatch kept as a LIST for env that needs valueFrom (secretKeyRef,
                   fieldRef) which a plain map cannot express. Replaced, not merged. */}}
            {{- with .Values.podEnvVars }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmpfs   # Writable scratch for /tmp while the root filesystem is read-only.
              mountPath: /tmp
            {{- if .Values.useSecretsVolume }}
            - name: {{ include "helm_chart.fullname" . }}-secret
              mountPath: "{{ .Values.secretVolumes.mountPath }}"
              readOnly: true
            {{- end }}
      volumes:
        - name: tmpfs
          emptyDir:
            medium: Memory
        {{- if .Values.useSecretsVolume }}
        - name: {{ include "helm_chart.fullname" . }}-secret
          secret:
            secretName: {{ .Values.secretVolumes.secretName }}
        {{- end }}
