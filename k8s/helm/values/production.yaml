# This file is specific to production environment.
# Any of the values in K8s/helm/values.yaml can be overridden here specific to production environment.

image:
  tag: "production"

# Lightweight, I/O-bound HTTP service — give it modest headroom, not GPU-class resources.
resources:
  limits:
    cpu: "8"
    memory: 16Gi
  requests:
    cpu: 250m
    memory: 256Mi

# NOTE: hostnames below are placeholders following the RCSB naming pattern — confirm the
# actual production URLs (and the TLS secret name) with DevOps before deploying.
# Clients connect to the MCP at https://<host>/mcp ; /healthz is used by probes.
ingress:
  enabled: true
  className: haproxy
  annotations:
    cert-manager.io/cluster-issuer: rutgers-acme
    kubernetes.io/tls-acme: "true"
  hosts:
    - host: mcp-beta.k8s.rcsb.org
      paths:
        - path: /
          pathType: ImplementationSpecific
    - host: mcp-beta.east.k8s.rcsb.org
      paths:
        - path: /
          pathType: ImplementationSpecific
    - host: mcp-beta.west.k8s.rcsb.org
      paths:
        - path: /
          pathType: ImplementationSpecific
    - host: mcp-beta.rcsb.org
      paths:
        - path: /
          pathType: ImplementationSpecific
    - host: mcp-beta-east.rcsb.org
      paths:
        - path: /
          pathType: ImplementationSpecific
    - host: mcp-beta-west.rcsb.org
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - hosts:
        - mcp-beta.k8s.rcsb.org
      secretName: mcp-beta.k8s.rcsb.org-tls
    - hosts:
        - mcp-beta.east.k8s.rcsb.org
      secretName: mcp-beta.east.k8s.rcsb.org-tls
    - hosts:
        - mcp-beta.west.k8s.rcsb.org
      secretName: mcp-beta.west.k8s.rcsb.org-tls
    - hosts:
        - mcp-beta.rcsb.org
      secretName: mcp-beta.rcsb.org-tls
    - hosts:
        - mcp-beta-east.rcsb.org
      secretName: mcp-beta-east.rcsb.org-tls
    - hosts:
        - mcp-beta-west.rcsb.org
      secretName: mcp-beta-west.rcsb.org-tls

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Deploy the bundled Redis (ClusterIP only — unreachable from outside the cluster) so
# report short links minted on one MCP replica resolve on all of them.
redis:
  enabled: true

# Hostnames for THIS environment. podEnv is a map, so this merges into values.yaml.
podEnv:
  # The public origin: makes rcsb_render_report return a link instead of inline html, and
  # is where the short link REDIRECTS to. That /r?d=<token> URL is self-contained, so the
  # GSLB name is correct here -- any cluster renders it.
  RCSB_MCP_REPORT_BASE_URL: "https://mcp-beta.rcsb.org"
  # Where the SHORT /r/<id> link POINTS. Must be cluster-pinned, because the id resolves
  # only against the store that minted it. `{coast}` is substituted by the app from the
  # COAST env var (see coastConfigMap in values.yaml), so this one value is correct in both
  # west and east.
  RCSB_MCP_REPORT_LINK_BASE_URL: "https://mcp-beta.{coast}.k8s.rcsb.org"
